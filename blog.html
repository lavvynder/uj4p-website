<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Utah Jews For Palestine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>.garamond { font-family: 'EB Garamond', serif; }</style>
</head>
<body class="bg-[#e5e3d9] text-gray-900 p-6 md:p-12 garamond">
    <nav class="max-w-4xl mx-auto mb-16">
        <a href="index.html" class="uppercase tracking-widest font-bold text-sm">← Home</a>
    </nav>

   <section class="max-w-6xl mx-auto px-4 py-12">
    <h1 class="text-4xl font-bold text-blue-900 mb-8 border-b-2 border-blue-900 pb-4">Latest Updates</h1>
    
    <div id="blog-posts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <p class="text-gray-500 italic">Loading latest dispatches...</p>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    async function loadBlogPosts() {
        const repo = "lavvynder/uj4p-website"; // Your repo
        const container = document.getElementById('blog-posts-container');
        
        try {
            // 1. Fetch the list of files in the blog folder
            const response = await fetch(`https://api.github.com/repos/${repo}/contents/blog`);
            const files = await response.json();
            
            if (!Array.isArray(files)) throw new Error("No posts found");

            container.innerHTML = ''; // Clear the loading message

            // 2. Loop through the files and create a card for each
            for (const file of files) {
                if (file.name.endsWith('.md')) {
                    const postData = await fetch(file.download_url).then(res => res.text());
                    
                    // Simple logic to grab the title from the "Frontmatter"
                    const titleMatch = postData.match(/title:\s*"(.*)"/) || postData.match(/title:\s*(.*)/);
                    const title = titleMatch ? titleMatch[1] : file.name;
                    
                    const card = `
                        <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow border border-gray-100">
                            <div class="p-6">
                                <h2 class="text-xl font-bold text-blue-800 mb-2">${title}</h2>
                                <a href="post.html?post=${file.name}" class="text-blue-600 font-semibold hover:underline">Read More →</a>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                }
            }
        } catch (error) {
            container.innerHTML = '<p class="text-red-500 text-center">Unable to load posts at this time. Please check back later.</p>';
        }
    }

    loadBlogPosts();
</script>
</body>
</html>
