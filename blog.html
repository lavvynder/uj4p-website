<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Utah Jews For Palestine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>.garamond { font-family: 'EB Garamond', serif; }</style>
</head>
<body class="bg-[#e5e3d9] text-gray-900 p-6 md:p-12 garamond">
    <nav class="max-w-4xl mx-auto mb-16">
        <a href="post.html?id=${file.name}" class="uppercase tracking-widest font-bold text-sm">← Home</a>
    </nav>

   <section class="max-w-6xl mx-auto px-4 py-12">
    <h1 class="text-4xl font-bold text-blue-900 mb-8 border-b-2 border-blue-900 pb-4">Latest Updates</h1>
    
    <div id="blog-posts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <p class="text-gray-500 italic">Loading latest dispatches...</p>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    async function loadBlogPosts() {
        // NOTE: Replace 'lavvynder/uj4p-website' with your exact repo name
        const repo = "lavvynder/uj4p-website"; 
        const container = document.getElementById('blog-posts-container');
        
        try {
            // We fetch the list from your live site's folder instead of the private GitHub API
            const response = await fetch('/blog/'); 
            if (!response.ok) throw new Error("Folder not accessible");

            // For now, since listing private files is hard, let's use a smarter 
            // way once you have 2-3 posts. But to get your Test Post showing:
            
            // Temporary fix to see your test post:
            const testPostName = "test-post.md"; // Change this to your actual file name in GitHub
            
            const card = `
                <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow border border-gray-100 p-6">
                    <h2 class="text-2xl font-bold text-blue-900 mb-4 uppercase tracking-wide">Test Post</h2>
                    <p class="text-gray-600 mb-6">Our first update is live. Click below to read the full dispatch.</p>
                    <a href="/blog/test-post" class="inline-block bg-blue-900 text-white px-6 py-2 rounded-full hover:bg-blue-800 transition-colors">
                        Read More →
                    </a>
                </div>
            `;
            container.innerHTML = card;

        } catch (error) {
            console.error(error);
            container.innerHTML = '<p class="text-gray-500 italic">Blog feed is initializing. Check back in a few minutes!</p>';
        }
    }
    loadBlogPosts();
</script>
</body>
</html>
