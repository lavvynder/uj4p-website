<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Utah Jews For Palestine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>.garamond { font-family: 'EB Garamond', serif; }</style>
</head>
<body class="bg-[#e5e3d9] text-gray-900 p-6 md:p-12 garamond">
    
    <nav class="max-w-4xl mx-auto mb-16">
        <a href="index.html" class="uppercase tracking-widest font-bold text-sm hover:text-blue-900 transition-colors">← Back to Home</a>
    </nav>

   <section class="max-w-6xl mx-auto px-4 py-12">
    <h1 class="text-4xl font-bold text-blue-900 mb-8 border-b-2 border-blue-900 pb-4 uppercase tracking-widest">Latest Updates</h1>
    
    <div id="blog-posts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <p class="text-gray-500 italic">Loading latest dispatches...</p>
    </div>
</section>

<script>
    async function loadBlogPosts() {
        const repo = "lavvynder/uj4p-website"; 
        const container = document.getElementById('blog-posts-container');
        
        try {
            const response = await fetch(`https://api.github.com/repos/${repo}/contents/blog`);
            const files = await response.json();

            container.innerHTML = ''; 

            // Sort files so the newest (highest date) is first
            files.sort((a, b) => b.name.localeCompare(a.name));

            for (const file of files) {
                if (file.name.endsWith('.md')) {
                    // Fetch the raw content to get the real title
                    const rawRes = await fetch(`https://raw.githubusercontent.com/${repo}/main/blog/${file.name}`);
                    const content = await rawRes.text();
                    
                    // This regex finds the title between the quotes: title: "My Title"
                    const titleMatch = content.match(/title:\s*"(.*?)"/) || content.match(/title:\s*(.*)/);
                    const prettyTitle = titleMatch ? titleMatch[1] : file.name.replace('.md', '');

                    const card = `
                        <div class="bg-white rounded-lg shadow-md p-8 flex flex-col justify-between border-t-4 border-blue-900">
                            <div>
                                <h2 class="text-2xl font-bold text-blue-900 mb-4 leading-tight">${prettyTitle}</h2>
                                <p class="text-gray-500 text-sm mb-6 uppercase tracking-widest font-bold">Dispatch</p>
                            </div>
                            <a href="post.html?id=${file.name}" class="inline-block bg-blue-900 text-white text-center px-6 py-2 rounded hover:bg-blue-800 transition-colors font-bold">
                                READ ARTICLE →
                            </a>
                        </div>
                    `;
                    container.innerHTML += card;
                }
            }
        } catch (error) {
            container.innerHTML = '<p class="text-gray-500 italic text-center col-span-full">Unable to load feed.</p>';
        }
    }
    loadBlogPosts();
</script>
</body>
</html>
