<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UJ4P | Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
    body { background-color: #e5e3d9; }
    .garamond { font-family: 'EB Garamond', serif; }
    
    /* This styles the text that comes out of the Markdown */
    .prose h1, .prose h2, .prose h3 { font-family: 'EB Garamond', serif; color: #1e3a8a; font-weight: bold; margin-top: 1.5rem; }
    .prose p { margin-bottom: 1.25rem; line-height: 1.8; font-size: 1.25rem; color: #374151; }
    .prose ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1.25rem; }
</style>

<article class="max-w-3xl mx-auto bg-white shadow-sm rounded-lg my-10 p-8 md:p-16 garamond">
    <div id="post-content" class="prose lg:prose-xl mx-auto">
        <p class="text-center italic text-gray-400">Loading dispatch...</p>
    </div>
</article>

<script>
    async function renderPost() {
        const params = new URLSearchParams(window.location.search);
        const postId = params.get('id');
        const container = document.getElementById('post-content');

        try {
            const repo = "lavvynder/uj4p-website";
            const response = await fetch(`https://raw.githubusercontent.com/${repo}/main/blog/${postId}`);
            const rawMarkdown = await response.text();

            const titleMatch = rawMarkdown.match(/title:\s*"(.*?)"/) || rawMarkdown.match(/title:\s*(.*)/);
            const prettyTitle = titleMatch ? titleMatch[1] : "Blog Post";

            const cleanMarkdown = rawMarkdown.replace(/^---[\s\S]*?---/, '');
            
            // We wrap the content in a styled header and the parsed markdown
            container.innerHTML = `
                <h1 class="text-5xl font-bold text-blue-900 mb-2 leading-tight">${prettyTitle}</h1>
                <p class="text-blue-700 uppercase tracking-[0.2em] font-bold text-sm mb-10 pb-4 border-b">Official Dispatch</p>
                <div class="blog-body-text">
                    ${marked.parse(cleanMarkdown)}
                </div>
            `;
            
            document.title = "UJ4P | " + prettyTitle;

        } catch (err) {
            container.innerHTML = "<h1 class='text-2xl'>Post not found</h1>";
        }
    }
    renderPost();
</script>
    
</body>
</html>
