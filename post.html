<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UJ4P | Dispatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { background-color: #e5e3d9; }
        .garamond { font-family: 'EB Garamond', serif; }
        
        .prose h1, .prose h2, .prose h3 { font-family: 'EB Garamond', serif; color: #1e3a8a; font-weight: bold; margin-top: 1.5rem; }
        .prose p { margin-bottom: 1.25rem; line-height: 1.8; font-size: 1.25rem; color: #374151; }
        .prose ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1.25rem; }
        .prose a { color: #1e3a8a; text-decoration: underline; font-weight: bold; }
    </style>
</head>
<body class="garamond">

    <nav class="max-w-3xl mx-auto px-6 pt-12">
        <a href="blog.html" class="text-blue-900 font-bold uppercase tracking-widest text-sm hover:text-blue-700 transition-colors inline-flex items-center gap-2">
            <span>←</span> Back to Blog
        </a>
    </nav>

    <article class="max-w-3xl mx-auto bg-white shadow-sm rounded-lg mt-6 mb-20 p-8 md:p-16">
        <div id="post-content" class="prose lg:prose-xl mx-auto">
            <p class="text-center italic text-gray-400">Loading dispatch...</p>
        </div>
    </article>

    <script>
        async function renderPost() {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');
            const container = document.getElementById('post-content');

            if (!postId) {
                container.innerHTML = "<h1 class='text-2xl'>Post not found.</h1><a href='blog.html' class='text-blue-900 underline'>Return to Blog</a>";
                return;
            }

            try {
                const repo = "lavvynder/uj4p-website";
                const response = await fetch(`https://raw.githubusercontent.com/${repo}/main/blog/${postId}`);
                
                if (!response.ok) throw new Error("Could not find the post file");
                
                const rawMarkdown = await response.text();

                const titleMatch = rawMarkdown.match(/title:\s*"(.*?)"/) || rawMarkdown.match(/title:\s*(.*)/);
                const prettyTitle = titleMatch ? titleMatch[1] : postId.replace('.md', '').replace(/-/g, ' ');

                const cleanMarkdown = rawMarkdown.replace(/^---[\s\S]*?---/, '');
                
               container.innerHTML = `
    <h1 class="text-5xl font-bold text-blue-900 mb-8 border-b pb-6 leading-tight">${prettyTitle}</h1>
    <div class="blog-body-text">
        ${marked.parse(cleanMarkdown)}
    </div>
`;
                
                document.title = "UJ4P | " + prettyTitle;

            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <h1 class='text-2xl'>Error loading post</h1>
                    <p class='mt-4 text-gray-600'>This usually happens if the repository is private or the post filename has changed.</p>
                    <a href='blog.html' class='text-blue-900 underline mt-4 block'>Back to Blog</a>
                `;
            }
        }
        renderPost();
    </script>
</body>
</html>
